[project]
name = "recon-triage"
version = "0.1.0"
description = "LLM agent that triages bank-to-GL reconciliation breaks, benchmarked against a rules-only baseline"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "numpy>=2.4.6",
    "openai>=3.19.2",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]
